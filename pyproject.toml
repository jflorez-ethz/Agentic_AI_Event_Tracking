[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-augmented"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["google-genai>=1.55,<4", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=9", "jsonschema>=4,<5"]
graph = ["langgraph>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
